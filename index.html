<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital@0;1&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main">
        <h1>BMI Calculator</h1>
        <form action="">
            <label for="height">Height</label>
            <input type="number" placeholder="IN  CM Height should be between 100 and 250 cm" id="height">
            <small class="heightErro text-warning"></small>
            <label for="weight">Weight</label>
            <input id="weight" placeholder="IN KG  Weight must be between 20 and 300 kg" type="number">
            <small class="weightError text-warning"></small><br>
            <button>Calculate</button>
        </form>
        <div class="result">
            <h4>Your BMI Scor</h4>
            <div class="display row g-3">
                <div class="col-6">
                    <h2 id="scor">50.30</h2>
                    
                </div>
                <div class="col-6 text-end categorydiv">
                    <h3 class="category">Hellow</h3>
                </div>
            </div>
        </div>
        <div class="info">
            <h4>BMI Weight Guid</h4>
            <p>Under Weight = Less then 18.6</p>
            <p>Normal Rang = 18.6 to 24.9</p>
            <p>OverWeight = Greater then 24.9</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
